"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
scan_timeout = 100

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:surface0 fg:blue"
format = "[](surface0)[$symbol ]($style)"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
Linux = "󰌽"

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:red"
format = "[$user ]($style)[](fg:surface0 bg:surface1)"

[directory]
style = "bg:surface1 fg:lavender"
format = "[ $path ]($style)[](fg:surface1 bg:base)"
truncation_length = 4
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Music" = " Music"
"Pictures" = " Pictures"

[git_branch]
symbol = ""
style = "bg:yellow fg:crust"
format = "[$symbol $branch ]($style)[](fg:yellow bg:base)"

[git_status]
style = "bg:yellow fg:crust"
format = "([$all_status$ahead_behind ]($style))"

[python]
symbol = ""
style = "bg:green fg:crust"
format = "[ $symbol ($version )]($style)[](fg:green bg:base)"

[nodejs]
symbol = ""
style = "bg:green fg:crust"
format = "[ $symbol ($version )]($style)[](fg:green bg:base)"

[rust]
symbol = ""
style = "bg:peach fg:crust"
format = "[ $symbol ($version )]($style)[](fg:peach bg:base)"

[golang]
symbol = ""
style = "bg:sky fg:crust"
format = "[ $symbol ($version )]($style)[](fg:sky bg:base)"

[cmd_duration]
min_time = 2_000
style = "bg:surface0 fg:subtext0"
format = "[  $duration ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
